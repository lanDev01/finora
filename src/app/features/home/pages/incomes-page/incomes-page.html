<app-header />

<main>
  <div class="page-toolbar">
    <a routerLink="/home" class="page-back">← Voltar ao início</a>

    <div class="page-actions">
      <app-button
        type="button"
        variant="outline"
        [loading]="incomesLoading()"
        aria-label="Recarregar receitas"
        (clicked)="reloadIncomes()"
      >
        <lucide-icon [img]="refreshIcon" [size]="18" aria-hidden="true" />
      </app-button>

      <app-button type="button" (clicked)="openNewIncomeModal()">Nova receita</app-button>
    </div>
  </div>

  <section class="ledger-section">
    <div class="ledger-header">
      <div>
        <h1 class="ledger-title">Receitas</h1>
        <p class="ledger-subtitle">{{ periodLabel() }}</p>
      </div>

      <div class="ledger-filter">
        <label for="incomes-period">Período</label>
        <input
          id="incomes-period"
          type="month"
          [value]="periodInput()"
          (change)="onPeriodChange($any($event.target).value)"
        />
      </div>
    </div>

    <app-table
      [columns]="incomeColumns"
      [rows]="incomesRows()"
      [loading]="incomesLoading()"
      [rowActions]="ledgerRowActions"
      emptyMessage="Nenhuma receita registrada neste período."
      (actionClick)="onIncomeTableAction($event)"
    />
  </section>
</main>
